<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BISIK: Sistem Cerdas Multimodal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="main-container">
        <div id="welcome-screen" class="card active">
            <h2>BISIK</h2>
            <p>Selamat datang di BISIK! Aplikasi ini membantu anak-anak memahami dunia di sekitar mereka.</p>
            <button id="start-button" class="btn primary-btn">Mulai</button>
        </div>

        <div id="main-menu" class="card">
            <button class="btn back-btn" onclick="showScreen('welcome-screen')">
                <i class="fas fa-arrow-left"></i> Kembali
            </button>
            <h2>BISIK</h2>
            <p>Pilih mode input yang ingin Anda gunakan</p>
            
            <button class="btn input-option voice-input" id="voice-s2s-button">
                <i class="fas fa-microphone"></i> Input Suara
                <span>Tanya dengan suara, dan dengarkan jawabannya langsung.</span>
            </button>
            
            <button class="btn input-option camera-input" onclick="alert('Fitur ini belum diimplementasikan.')">
                <i class="fas fa-camera"></i> Gunakan Kamera
                <span>Arahkan kamera ke objek yang ingin dianalisis untuk mendapatkan penjelasan secara real-time.</span>
            </button>
            <button class="btn input-option upload-input" onclick="alert('Fitur ini belum diimplementasikan.')">
                <i class="fas fa-upload"></i> Unggah Gambar
                <span>Pilih gambar dari perangkat Anda untuk dianalisis dan dijelaskan dengan detail.</span>
            </button>
            <button class="btn input-option text-input" onclick="alert('Fitur ini belum diimplementasikan.')">
                <i class="fas fa-keyboard"></i> Masukkan Teks
                <span>Deskripsikan objek atau adegan yang ingin Anda lihat, dan kami akan menghasilkan gambar untuk Anda.</span>
            </button>
        </div>

        <div id="s2s-screen" class="card">
            <button class="btn back-btn" onclick="showScreen('main-menu')">
                <i class="fas fa-arrow-left"></i> Kembali
            </button>
            <h2>BISIK - Tanya Jawab Suara</h2>
            
            <div id="s2s-container">
                <div class="user-input-area">
                    <p id="mic-status">Tekan dan tahan tombol di bawah untuk berbicara...</p>
                    <div id="mic-animation"></div>
                    <button id="record-button" class="btn primary-btn mic-btn" title="Tekan dan tahan untuk berbicara">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>
                
                <div class="chat-response-area">
                    <textarea id="user-transcript" placeholder="Hasil transkripsi Anda akan muncul di sini..." readonly></textarea>
                    <div class="response-box">
                        <p id="ai-response-text" class="response-text">Jawaban dari Gemini akan muncul di sini.</p>
                        <div id="loading-spinner" class="spinner"></div>
                        <div class="action-buttons">
                            <button id="play-tts-button" class="btn action-btn" disabled><i class="fas fa-volume-up"></i> Bacakan</button>
                            <button id="stop-tts-button" class="btn action-btn" disabled><i class="fas fa-stop"></i> Hentikan</button>
                            <button id="reset-s2s-button" class="btn action-btn" onclick="resetS2S()"><i class="fas fa-redo"></i> Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="about-us-placeholder">About Us</div>
    <script src="script.js"></script>
</body>
</html>
